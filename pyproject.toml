[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-copilot"
version = "0.7.0"
description = "Live call transcription copilot + YouTube video transcriber — Textual TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "anthropic>=0.41",
    "websockets>=13.0",
    "numpy>=1.24",
    # Required unconditionally by SileroVAD (src/audio/vad_silero.py) — the
    # only VAD implementation, used on every live call regardless of which
    # STT/LLM backend is selected. Not a real "extra" today.
    "torch>=2.0",
    "torchaudio>=2.0",
    # torch.hub's cached snakers4/silero-vad repo imports this directly — not
    # pulled in transitively unless something else in the environment already
    # depends on it (pytest/onnxruntime do in dev, which is exactly why this
    # was missing: a clean minimal-profile install has neither).
    "packaging>=23.0",
    # WASAPI loopback capture — Windows only (src/audio/wasapi_source.py).
    # Linux uses PulseAudio via subprocess (src/audio/pulse_source.py), no
    # PyAudio dependency there.
    "PyAudioWPatch>=0.2.12.8; sys_platform == 'win32'",
    # BlackHole loopback capture — macOS only (src/audio/blackhole_source.py).
    # Plain PyAudio suffices here: BlackHole shows up as a regular input
    # device once installed (brew install blackhole-2ch), no loopback-specific
    # API needed the way WASAPI requires PyAudioWPatch on Windows.
    "PyAudio>=0.2.14; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Local Whisper STT backend (STT_BACKEND=whisper_local) — alternative to the
# default Deepgram (cloud, already covered by the base `websockets` dep).
whisper-local = ["faster-whisper>=1.0"]
# YouTube/video download + batch transcription (Video tab). imageio-ffmpeg
# bundles a portable ffmpeg binary — no system install / PATH entry needed.
video = ["yt-dlp>=2024.1.0", "openai-whisper>=20231117", "imageio-ffmpeg>=0.5.0"]
# Persistent semantic search: live in-call RAG, the Tools catalog, segment
# search, and category dedup. Lazily imported (src/rag/chroma_store.py,
# src/rag/tools_store.py, src/rag/segments_store.py, src/rag/categories_store.py)
# — the app runs fine without it, those features just no-op (category dedup
# falls back to the LLM-judge path, see src/processing/category_dedup.py).
rag = ["chromadb>=0.5.0"]
# Read-only MCP server (src/mcp/) exposing session/category/tools/content
# data to MCP clients (e.g. Claude Desktop) via the `call-copilot-mcp`
# console script. Only src/mcp/server.py imports this — src/mcp/queries.py
# and src/mcp/tools.py stay MCP-SDK-free so the pure query/handler logic is
# importable and testable without this extra installed.
mcp = ["mcp>=1.0.0"]
# Named profile bundling every extra above. Listed directly (not as a
# self-referential "call-copilot[...]" extra) so it resolves the same way
# for a git install as it does once/if this is ever published to PyPI.
full = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1.0",
    "openai-whisper>=20231117",
    "imageio-ffmpeg>=0.5.0",
    "chromadb>=0.5.0",
    "mcp>=1.0.0",
]

[project.scripts]
call-copilot = "src.tui.app:main"
call-copilot-mcp = "src.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
